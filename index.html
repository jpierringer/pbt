<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Budget</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%2780%27 font-size=%2780%27>💰</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#23302b;--mut:#7a857f;--line:#e7e3da;--acc:#2f7d6d;--bad:#d1603d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c1a;--card:#212825;--tx:#eef2ef;--mut:#95a19b;--line:#2f3833;--acc:#4fb39f;--bad:#e9825f}}
:root[data-theme="dark"]{--bg:#171c1a;--card:#212825;--tx:#eef2ef;--mut:#95a19b;--line:#2f3833;--acc:#4fb39f;--bad:#e9825f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px}
.nav button{width:36px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
.pos{color:var(--acc)}.neg{color:var(--bad)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input[type=number]{width:110px;font-size:20px;font-weight:600}.add .note{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border-radius:999px;padding:5px 11px;font-size:14px}
.chip.on{color:#fff;border-color:transparent}
.go{width:100%;background:var(--acc);color:#fff;border:0;padding:12px;font-weight:600;font-size:16px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}.seg .on{background:var(--tx);color:var(--bg)}
.donutw{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{flex:1;min-width:140px;font-size:14px}.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{margin:10px 0}.bar .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.track{height:8px;background:var(--bg);border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}
.lim{width:80px;padding:2px 6px;text-align:right;font-size:14px}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}.tx .m{flex:1;min-width:0}.tx .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;color:var(--mut);padding:4px 8px}
.banner{background:#fff3cd;color:#5c4a00;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.scroll{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:12px}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CATS={Groceries:"#4c9f70",Dining:"#e0954f",Transport:"#4f86c6",Home:"#8b6fbf",Bills:"#c9585c",Fun:"#d96fa0",Health:"#3fa7b5",Shopping:"#b8a13a",Other:"#8a938e",Mortgage:"#7a5c3e",Electric:"#e6c02f",Gas:"#e07b39",Water:"#3b9ad9",Insurance:"#5c6bc0","Car payment":"#607d8b","Cell phone":"#26a69a"};
const INC=["Salary","Other income"];
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function limitFor(c,m=S.month){let b=null;(S.brows||[]).forEach(r=>{if(r.cat==c&&r.month<=m&&(!b||r.month>b.month))b=r});return b?b.amount:0}
const iso=d=>d.toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={month:new Date().toISOString().slice(0,7),kind:"expense",cat:"Groceries",tx:[],limits:{},names:{},uid:null,shared:false};
let dbh=null;

function mshift(m,d){const [y,mo]=m.split("-").map(Number);const t=new Date(Date.UTC(y,mo-1+d,1));return t.toISOString().slice(0,7)}
function mlabel(m){return new Date(m+"-15").toLocaleDateString(undefined,{month:"long",year:"numeric"})}

function donut(data,total){
  let a=0,R=52,C=2*Math.PI*R,out="";
  data.forEach(([c,v])=>{const l=v/total*C;out+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${CATS[c]}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"/>`;a+=l});
  return `<svg width="140" height="140" viewBox="0 0 140 140">${out}<text x="70" y="66" text-anchor="middle" font-size="12" fill="var(--mut)">spent</text><text x="70" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="var(--tx)">${fmt(total)}</text></svg>`;
}
function trend(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(mshift(S.month,-i));
  const vals=ms.map(m=>[m,S.tx.filter(t=>t.date.startsWith(m)&&t.kind=="expense").reduce((s,t)=>s+t.amount,0),S.tx.filter(t=>t.date.startsWith(m)&&t.kind=="income").reduce((s,t)=>s+t.amount,0)]);
  const mx=Math.max(1,...vals.flatMap(v=>[v[1],v[2]]));
  let o="";vals.forEach((v,i)=>{const x=i*52+6,h1=v[1]/mx*90,h2=v[2]/mx*90;
    o+=`<rect x="${x}" y="${100-h2}" width="18" height="${h2}" rx="3" fill="var(--acc)" opacity=".85"/><rect x="${x+20}" y="${100-h1}" width="18" height="${h1}" rx="3" fill="var(--bad)" opacity=".85"/><text x="${x+19}" y="116" text-anchor="middle" font-size="11" fill="var(--mut)">${new Date(v[0]+"-15").toLocaleDateString(undefined,{month:"short"})}</text>`});
  return `<svg width="100%" viewBox="0 0 312 122">${o}</svg><div style="font-size:12px;color:var(--mut)"><span class="pos">■</span> income &nbsp;<span class="neg">■</span> spending</div>`;
}

function render(){
  if(!S.session){login();return}
  const mt=S.tx.filter(t=>t.date.startsWith(S.month)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const exp=mt.filter(t=>t.kind=="expense"),inc=mt.filter(t=>t.kind=="income");
  const spent=exp.reduce((s,t)=>s+t.amount,0),earned=inc.reduce((s,t)=>s+t.amount,0);
  const by={};exp.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const sorted=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const focus=document.activeElement&&document.activeElement.id;
  const cats=S.kind=="expense"?Object.keys(CATS):INC;
  if(!cats.includes(S.cat))S.cat=cats[0];
  const keep={a:$("amt")?.value||"",n:$("note")?.value||""};
  $("app").innerHTML=`
  ${S.shared?"":'<div class="banner">Not connected to shared storage — entries here won\'t sync or be saved. Open the published link while signed in.</div>'}
  <div class="top"><h1>💰 Our Budget</h1><div class="nav"><button id="pm">‹</button> <b>${mlabel(S.month)}</b> <button id="nm">›</button></div></div>
  <div class="card"><div class="stats"><div><b class="pos">${fmt(earned)}</b><span>Income</span></div><div><b>${fmt(spent)}</b><span>Spent</span></div><div><b class="${earned-spent>=0?"pos":"neg"}">${fmt(earned-spent)}</b><span>Left</span></div></div></div>
  <div class="card"><div class="seg"><button data-k="expense" class="${S.kind=="expense"?"on":""}">Expense</button><button data-k="income" class="${S.kind=="income"?"on":""}">Income</button></div>
  <div class="chips">${cats.map(c=>`<button class="chip ${c==S.cat?"on":""}" data-c="${c}" style="${c==S.cat?"background:"+(CATS[c]||"var(--acc)"):""}">${c}</button>`).join("")}</div>
  <div class="add"><input id="amt" type="number" step="0.01" inputmode="decimal" placeholder="$0.00" value="${keep.a}"><input id="note" class="note" placeholder="Note (optional)" value="${esc(keep.n)}"></div>
  <button class="go" id="add">Add ${S.kind}</button></div>
  <div class="card"><h2>Where it went</h2>${sorted.length?`<div class="donutw">${donut(sorted,spent)}<div class="legend">${sorted.map(([c,v])=>`<div><span class="dot" style="background:${CATS[c]}"></span>${c}<span style="margin-left:auto">${fmt(v)}</span></div>`).join("")}</div></div>`:'<div class="empty">No spending yet this month</div>'}</div>
  <div class="card"><h2>Budgets</h2>${Object.keys(CATS).map(c=>{const v=by[c]||0,l=limitFor(c),p=l?Math.min(100,v/l*100):0;
   return `<div class="bar"><div class="r"><span><span class="dot" style="background:${CATS[c]};display:inline-block"></span> ${c} <span style="color:var(--mut)">${fmt(v)} of</span></span><input class="lim" data-l="${c}" type="number" step="0.01" inputmode="decimal" placeholder="set" value="${l||""}"></div><div class="track"><div class="fill" style="width:${l?p:0}%;background:${v>l&&l?"var(--bad)":CATS[c]}"></div></div></div>`}).join("")}</div>
  <div class="card"><h2>6-month trend</h2>${trend()}</div>
  <div class="card"><h2>Transactions</h2>${mt.length?mt.map(t=>`<div class="tx"><span class="dot" style="background:${CATS[t.cat]||"var(--acc)"}"></span><div class="m"><b>${esc(t.cat)}</b>${t.note?" · "+esc(t.note):""}<small>${new Date(t.date+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}${S.names[t.by]?" · "+esc(S.names[t.by]):""}</small></div><b class="${t.kind=="income"?"pos":""}">${t.kind=="income"?"+":""}${fmt(t.amount)}</b><button class="x" data-d="${t.id}">✕</button></div>`).join(""):'<div class="empty">Nothing yet — add your first one above</div>'}</div>`;
  $("pm").onclick=()=>{S.month=mshift(S.month,-1);render()};
  $("nm").onclick=()=>{S.month=mshift(S.month,1);render()};
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.kind=b.dataset.k;render()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;render()});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>del(b.dataset.d));
  document.querySelectorAll(".lim").forEach(i=>i.onchange=()=>setLimit(i.dataset.l,Math.round((parseFloat(i.value)||0)*100)/100));
  $("add").onclick=add;
  $("amt").onkeydown=$("note").onkeydown=e=>{if(e.key=="Enter")add()};
  if(focus&&$(focus))$(focus).focus();
}
// ---- CONFIG: paste from Supabase > Project Settings > API ----
const SUPABASE_URL="ekelextwaqakswkjshyz.supabase.co", SUPABASE_KEY="sb_publishable_7lmfB5WjhaDAS0Mv6X_4pA_qcBHW4XH";
// ---------------------------------------------------------------
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function login(){
  $("app").innerHTML=`<div class="card" style="margin-top:12vh"><h1 style="margin-top:0">💰 Our Budget</h1><input id="em" type="email" placeholder="Email" style="width:100%;margin-bottom:8px"><input id="pw" type="password" placeholder="Password" style="width:100%;margin-bottom:8px"><button class="go" id="li">Sign in</button><div id="err" class="neg" style="margin-top:8px"></div></div>`;
  const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)$("err").textContent=error.message};
  $("li").onclick=go;$("pw").onkeydown=e=>{if(e.key=="Enter")go()};
}
async function load(){
  const [t,b]=await Promise.all([sb.from("transactions").select("*"),sb.from("budgets").select("*")]);
  if(t.data)S.tx=t.data.map(r=>{S.names[r.by_name]=r.by_name;return{...r,amount:+r.amount,by:r.by_name,ts:Date.parse(r.created_at)}});
  if(b.data)S.brows=b.data.map(r=>({cat:r.cat,month:r.month,amount:+r.amount}));
  render();
}
async function add(){
  const amount=Math.round(parseFloat($("amt").value)*100)/100;if(!(amount>0)){$("amt").focus();return}
  const row={amount,kind:S.kind,cat:S.cat,note:$("note").value.trim(),date:S.month==new Date().toISOString().slice(0,7)?iso(new Date()):S.month+"-01",by_name:S.me};
  $("amt").value="";$("note").value="";
  const {error}=await sb.from("transactions").insert(row);
  if(error)alert("Couldn't save: "+error.message);
  await load();$("amt")&&$("amt").focus();
}
async function del(id){const {error}=await sb.from("transactions").delete().eq("id",id);if(error)alert(error.message);load()}
async function setLimit(cat,v){
  S.brows=(S.brows||[]).filter(r=>!(r.cat==cat&&r.month==S.month)).concat({cat,month:S.month,amount:v});
  const {error}=await sb.from("budgets").upsert({cat,month:S.month,amount:v},{onConflict:"cat,month"});if(error)alert(error.message);
  render();
}
sb.auth.onAuthStateChange((_e,session)=>{
  S.session=session;S.shared=!!session;
  if(session){S.me=session.user.email.split("@")[0];load()}else render();
});
sb.channel("household").on("postgres_changes",{event:"*",schema:"public"},()=>{if(S.session&&!(document.activeElement&&document.activeElement.classList.contains("lim")))load()}).subscribe();
</script></body></html>
