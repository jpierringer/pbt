<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Budget</title><link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f7d6d">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#23302b;--mut:#7a857f;--line:#e7e3da;--acc:#2f7d6d;--bad:#d1603d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c1a;--card:#212825;--tx:#eef2ef;--mut:#95a19b;--line:#2f3833;--acc:#4fb39f;--bad:#e9825f}}
:root[data-theme="dark"]{--bg:#171c1a;--card:#212825;--tx:#eef2ef;--mut:#95a19b;--line:#2f3833;--acc:#4fb39f;--bad:#e9825f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px}
.nav button{width:36px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mut)}
.pos{color:var(--acc)}.neg{color:var(--bad)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input[type=number]{width:110px;font-size:20px;font-weight:600}.add .note{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border-radius:999px;padding:5px 11px;font-size:14px}
.chip.on{color:#fff;border-color:transparent}
.go{width:100%;background:var(--acc);color:#fff;border:0;padding:12px;font-weight:600;font-size:16px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1}.seg .on{background:var(--tx);color:var(--bg)}
.donutw{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{flex:1;min-width:140px;font-size:14px}.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{margin:10px 0}.bar .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.track{height:8px;background:var(--bg);border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}
.lim{width:80px;padding:2px 6px;text-align:right;font-size:14px}
.tx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}.tx .m{flex:1;min-width:0}.tx .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;color:var(--mut);padding:4px 8px}
.banner{background:#fff3cd;color:#5c4a00;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.scroll{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:12px}
.tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.tot span{display:block;color:var(--mut);font-size:12px}.tot b{font-size:18px}.tot div:last-child{text-align:right}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script>
function showErr(m){let b=document.getElementById("errbar");if(!b){b=document.createElement("div");b.id="errbar";b.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#fde8e4;color:#7a2512;border-radius:10px;padding:10px 12px;font:14px system-ui;white-space:pre-wrap";b.onclick=()=>b.remove();document.body.appendChild(b)}b.textContent="Something went wrong (tap to dismiss):\n"+m}
window.addEventListener("error",e=>showErr(e.message+(e.filename?" ["+e.filename.split("/").pop()+":"+e.lineno+"]":"")));
window.addEventListener("unhandledrejection",e=>showErr(String(e.reason&&e.reason.message||e.reason)));
let CATS={},ALLC={},INC=[];
const col=c=>ALLC[c]||"var(--acc)";
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function limitFor(c,m=S.month){let b=null;(S.brows||[]).forEach(r=>{if(r.cat==c&&r.month<=m&&(!b||r.month>b.month))b=r});return b?b.amount:0}
const iso=d=>d.toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={month:new Date().toISOString().slice(0,7),kind:"expense",cat:"Groceries",tx:[],limits:{},names:{},uid:null,shared:false};
let dbh=null;

function mshift(m,d){const [y,mo]=m.split("-").map(Number);const t=new Date(Date.UTC(y,mo-1+d,1));return t.toISOString().slice(0,7)}
function mlabel(m){return new Date(m+"-15").toLocaleDateString(undefined,{month:"long",year:"numeric"})}

function donut(data,total){
  let a=0,R=52,C=2*Math.PI*R,out="";
  data.forEach(([c,v])=>{const l=v/total*C;out+=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${col(c)}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 70 70)"/>`;a+=l});
  return `<svg width="140" height="140" viewBox="0 0 140 140">${out}<text x="70" y="66" text-anchor="middle" font-size="12" fill="var(--mut)">spent</text><text x="70" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="var(--tx)">${fmt(total)}</text></svg>`;
}
function trend(){
  const ms=[];for(let i=5;i>=0;i--)ms.push(mshift(S.month,-i));
  const vals=ms.map(m=>[m,S.tx.filter(t=>t.date.startsWith(m)&&t.kind=="expense").reduce((s,t)=>s+t.amount,0),S.tx.filter(t=>t.date.startsWith(m)&&t.kind=="income").reduce((s,t)=>s+t.amount,0)]);
  const mx=Math.max(1,...vals.flatMap(v=>[v[1],v[2]]));
  let o="";vals.forEach((v,i)=>{const x=i*52+6,h1=v[1]/mx*90,h2=v[2]/mx*90;
    o+=`<rect x="${x}" y="${100-h2}" width="18" height="${h2}" rx="3" fill="var(--acc)" opacity=".85"/><rect x="${x+20}" y="${100-h1}" width="18" height="${h1}" rx="3" fill="var(--bad)" opacity=".85"/><text x="${x+19}" y="116" text-anchor="middle" font-size="11" fill="var(--mut)">${new Date(v[0]+"-15").toLocaleDateString(undefined,{month:"short"})}</text>`});
  return `<svg width="100%" viewBox="0 0 312 122">${o}</svg><div style="font-size:12px;color:var(--mut)"><span class="pos">■</span> income &nbsp;<span class="neg">■</span> spending</div>`;
}

function updTot(){
  let t=0;document.querySelectorAll(".lim").forEach(i=>t+=parseFloat(i.value)||0);
  t=Math.round(t*100)/100;const u=Math.round(((S.earned||0)-t)*100)/100;
  $("tot").textContent=fmt(t);$("unal").textContent=fmt(u);$("unal").className=u>=0?"pos":"neg";
}
function render(){
  if(!S.session){login();return}
  const mt=S.tx.filter(t=>t.date.startsWith(S.month)).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const exp=mt.filter(t=>t.kind=="expense"),inc=mt.filter(t=>t.kind=="income");
  const spent=exp.reduce((s,t)=>s+t.amount,0),earned=inc.reduce((s,t)=>s+t.amount,0);
  const by={};exp.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  S.earned=earned;const totB=Math.round(Object.keys(CATS).reduce((a,c)=>a+limitFor(c),0)*100)/100,unal=Math.round((earned-totB)*100)/100;
  const sorted=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const focus=document.activeElement&&document.activeElement.id;
  const cats=S.kind=="expense"?Object.keys(CATS):INC;
  if(!cats.includes(S.cat))S.cat=cats[0];
  const keepNp=$("np")?.value||"";const kc={n:$("cn")?.value||"",c:$("cc")?.value||"#4c9f70",k:$("ck")?.value||"expense"};const keep={a:$("amt")?.value||"",n:$("note")?.value||""};
  $("app").innerHTML=`
  ${S.shared?"":'<div class="banner">Not connected to shared storage — entries here won\'t sync or be saved. Open the published link while signed in.</div>'}
  <div class="top"><h1>💰 Our Budget</h1><div class="nav"><button id="pm">‹</button> <b>${mlabel(S.month)}</b> <button id="nm">›</button></div></div>
  <div class="card"><div class="stats"><div><b class="pos">${fmt(earned)}</b><span>Income</span></div><div><b>${fmt(spent)}</b><span>Spent</span></div><div><b class="${earned-spent>=0?"pos":"neg"}">${fmt(earned-spent)}</b><span>Left</span></div></div></div>
  <div class="card"><div class="seg"><button data-k="expense" class="${S.kind=="expense"?"on":""}">Expense</button><button data-k="income" class="${S.kind=="income"?"on":""}">Income</button></div>
  <div class="chips">${cats.map(c=>`<button class="chip ${c==S.cat?"on":""}" data-c="${c}" style="${c==S.cat?"background:"+col(c):""}">${c}</button>`).join("")}</div>
  <div class="add"><input id="amt" type="number" step="0.01" inputmode="decimal" placeholder="$0.00" value="${keep.a}"><input id="note" class="note" placeholder="Note (optional)" value="${esc(keep.n)}"></div>
  <button class="go" id="add">Add ${S.kind}</button></div>
  <div class="card"><h2>Where it went</h2>${sorted.length?`<div class="donutw">${donut(sorted,spent)}<div class="legend">${sorted.map(([c,v])=>`<div><span class="dot" style="background:${col(c)}"></span>${c}<span style="margin-left:auto">${fmt(v)}</span></div>`).join("")}</div></div>`:'<div class="empty">No spending yet this month</div>'}</div>
  <div class="card"><h2>Budgets</h2>${Object.keys(CATS).map(c=>{const v=by[c]||0,l=limitFor(c),p=l?Math.min(100,v/l*100):0;
   return `<div class="bar"><div class="r"><span><span class="dot" style="background:${col(c)};display:inline-block"></span> ${c} <span style="color:var(--mut)">${fmt(v)} of</span></span><input class="lim" data-l="${c}" type="number" step="0.01" inputmode="decimal" placeholder="set" value="${l||""}"></div><div class="track"><div class="fill" style="width:${l?p:0}%;background:${v>l&&l?"var(--bad)":col(c)}"></div></div></div>`}).join("")}
  <div class="tot"><div><span>Total budgeted</span><b id="tot">${fmt(totB)}</b></div><div><span>Income − budgeted</span><b id="unal" class="${unal>=0?"pos":"neg"}">${fmt(unal)}</b></div></div></div>
  <div class="card"><h2>6-month trend</h2>${trend()}</div>
  <div class="card"><h2>Transactions</h2>${mt.length?mt.map(t=>`<div class="tx"><span class="dot" style="background:${col(t.cat)}"></span><div class="m"><b>${esc(t.cat)}</b>${t.note?" · "+esc(t.note):""}<small>${new Date(t.date+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}${S.names[t.by]?" · "+esc(S.names[t.by]):""}</small></div><b class="${t.kind=="income"?"pos":""}">${t.kind=="income"?"+":""}${fmt(t.amount)}</b><button class="x" data-d="${t.id}">✕</button></div>`).join(""):'<div class="empty">Nothing yet — add your first one above</div>'}</div>
  <div class="card"><h2>Categories</h2>
  ${(S.crows||[]).map(r=>`<div class="tx" style="${r.archived?"opacity:.5":""}"><span class="dot" style="background:${esc(r.color)}"></span><div class="m">${esc(r.name)} <small style="display:inline">${r.kind}${r.archived?" · archived":""}</small></div><button data-ca="${r.id}" data-arch="${r.archived?0:1}">${r.archived?"Restore":"Archive"}</button></div>`).join("")}
  <div class="add" style="margin-top:12px"><input id="cn" class="note" placeholder="New category name" value="${esc(kc.n)}"><input id="cc" type="color" value="${kc.c}" style="width:46px;padding:2px"><select id="ck" style="font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)"><option value="expense" ${kc.k=="expense"?"selected":""}>Expense</option><option value="income" ${kc.k=="income"?"selected":""}>Income</option></select></div>
  <button id="addcat" class="go">Add category</button><div class="neg" style="font-size:14px;margin-top:6px">${esc(S.catmsg||"")}</div>
  <div style="font-size:12px;color:var(--mut);margin-top:6px">Archived categories leave the lists but keep your history.</div></div>
  <div class="card"><h2>Account</h2><div style="font-size:14px;color:var(--mut);margin-bottom:8px">Signed in as ${esc(S.session.user.email)}</div>
  <div class="add"><input id="np" class="note" type="password" autocomplete="new-password" placeholder="New password (8+ characters)" value="${esc(keepNp)}"><button id="setpw">Update</button></div>
  <div style="font-size:14px;min-height:20px" class="${S.pwmsg&&S.pwmsg[0]=="P"?"pos":"neg"}">${esc(S.pwmsg||"")}</div>
  <button id="so" style="margin-top:6px">Sign out</button></div>`;
  $("pm").onclick=()=>{S.month=mshift(S.month,-1);render()};
  $("nm").onclick=()=>{S.month=mshift(S.month,1);render()};
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{S.kind=b.dataset.k;render()});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;render()});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>del(b.dataset.d));
  document.querySelectorAll(".lim").forEach(i=>i.oninput=updTot);
  document.querySelectorAll(".lim").forEach(i=>i.onchange=()=>setLimit(i.dataset.l,Math.round((parseFloat(i.value)||0)*100)/100));
  $("add").onclick=add;$("setpw").onclick=setPw;$("addcat").onclick=addCat;$("cn").onkeydown=e=>{if(e.key=="Enter")addCat()};document.querySelectorAll("[data-ca]").forEach(b=>b.onclick=()=>toggleCat(b.dataset.ca,b.dataset.arch=="1"));$("so").onclick=()=>sb.auth.signOut();
  $("np").onkeydown=e=>{if(e.key=="Enter")setPw()};
  $("amt").onkeydown=$("note").onkeydown=e=>{if(e.key=="Enter")add()};
  if(focus&&$(focus))$(focus).focus();
}
// ---- CONFIG: paste from Supabase > Project Settings > API ----
const SUPABASE_URL="https://ekelextwaqakswkjshyz.supabase.co", SUPABASE_KEY="sb_publishable_7lmfB5WjhaDAS0Mv6X_4pA_qcBHW4XH";
// ---------------------------------------------------------------
const mem={};
const store={getItem:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},removeItem:k=>{try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:store}});
function login(){
  $("app").innerHTML=`<div class="card" style="margin-top:12vh"><h1 style="margin-top:0">💰 Our Budget</h1><input id="em" type="email" placeholder="Email" style="width:100%;margin-bottom:8px"><input id="pw" type="password" placeholder="Password" style="width:100%;margin-bottom:8px"><button class="go" id="li">Sign in</button><div id="err" class="neg" style="margin-top:8px"></div></div>`;
  const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)$("err").textContent=error.message};
  $("li").onclick=go;$("pw").onkeydown=e=>{if(e.key=="Enter")go()};
}
async function load(){
  const [t,b,c]=await Promise.all([sb.from("transactions").select("*"),sb.from("budgets").select("*"),sb.from("categories").select("*").order("sort")]);
  if(t.error)showErr("Transactions: "+t.error.message);
  if(b.error)showErr("Budgets: "+b.error.message);
  if(c.error)showErr("Categories: "+c.error.message+" (has migrate-categories.sql been run?)");
  if(c.data){S.crows=c.data;ALLC={};CATS={};INC=[];c.data.forEach(r=>{ALLC[r.name]=r.color;if(!r.archived){if(r.kind=="expense")CATS[r.name]=r.color;else INC.push(r.name)}})}
  if(t.data)S.tx=t.data.map(r=>{S.names[r.by_name]=r.by_name;return{...r,amount:+r.amount,by:r.by_name,ts:Date.parse(r.created_at)}});
  if(b.data)S.brows=b.data.map(r=>({cat:r.cat,month:r.month,amount:+r.amount}));
  render();
}
async function add(){
  const amount=Math.round(parseFloat($("amt").value)*100)/100;if(!(amount>0)){$("amt").focus();return}
  const row={amount,kind:S.kind,cat:S.cat,note:$("note").value.trim(),date:S.month==new Date().toISOString().slice(0,7)?iso(new Date()):S.month+"-01",by_name:S.me};
  $("amt").value="";$("note").value="";
  const {error}=await sb.from("transactions").insert(row);
  if(error)alert("Couldn't save: "+error.message);
  await load();$("amt")&&$("amt").focus();
}
async function addCat(){
  const name=$("cn").value.replace(/["<>&]/g,"").trim();if(!name){$("cn").focus();return}
  if(S.crows.some(r=>r.name.toLowerCase()==name.toLowerCase())){S.catmsg="That name already exists (it may be archived).";render();return}
  const sort=Math.max(0,...S.crows.map(r=>r.sort))+1;
  const {error}=await sb.from("categories").insert({name,color:$("cc").value,kind:$("ck").value,sort});
  S.catmsg=error?error.message:"";$("cn").value="";load();
}
async function toggleCat(id,archived){const {error}=await sb.from("categories").update({archived}).eq("id",id);S.catmsg=error?error.message:"";load()}
async function setPw(){
  const p=$("np").value;
  if(p.length<8){S.pwmsg="Use at least 8 characters.";render();return}
  const {error}=await sb.auth.updateUser({password:p});
  S.pwmsg=error?error.message:"Password updated ✓";$("np").value="";render();
}
async function del(id){const {error}=await sb.from("transactions").delete().eq("id",id);if(error)alert(error.message);load()}
async function setLimit(cat,v){
  S.brows=(S.brows||[]).filter(r=>!(r.cat==cat&&r.month==S.month)).concat({cat,month:S.month,amount:v});
  const {error}=await sb.from("budgets").upsert({cat,month:S.month,amount:v},{onConflict:"household_id,cat,month"});if(error)alert(error.message);
  render();
}
sb.auth.onAuthStateChange((_e,session)=>{
  S.session=session;S.shared=!!session;
  if(session){S.me=session.user.email.split("@")[0];load()}else{S.tx=[];S.brows=[];S.pwmsg="";render()}
});
sb.channel("household").on("postgres_changes",{event:"*",schema:"public"},()=>{if(S.session&&!(document.activeElement&&document.activeElement.classList.contains("lim")))load()}).subscribe();
</script></body></html>
